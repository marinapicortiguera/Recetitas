P.home=()=>{const pool=S.recipes.slice(0,3),f=pool[V.f%(pool.length||1)],fv=S.recipes.filter(r=>r.fav);
const q=(p,t,c,x)=>`<div class="q ${c}" data-act="go" data-p="${p}">${x}<b>${t}</b><span class="go">${ic('arrow',15)}</span></div>`;
return`<div class="mg"><div class="L"><div class="hh o1">${BOW}<h1>¡Hola! ${ic('heart',46)}</h1><p class="sub">¿Qué vamos a cocinar hoy? ♡</p></div>
<div class="qk o3">${q('recipes','Mis<br>Recetas','sky',S.recipes[0]?im(S.recipes[0]):'<span class="qi">'+ic('book',44)+'</span>')}${q('cal','Calendario','sky','<span class="qi">'+ic('cal',44)+'</span>')}${q('shop','Lista de la<br>Compra','but','<span class="qi">'+ic('cart',44)+'</span>')}</div>
<div class="card o4">${cal('mini')}</div>
<div class="card o7"><div class="ch"><h3><span class="fav">${ic('heart',26)}</span> Mis recetas favoritas</h3><a class="lk" data-act="go" data-p="favs" href="#favs">Ver todas ${ic('arrow',14)}</a></div>${fv.length?`<div class="fr">${fv.slice(0,4).map(r=>`<div class="rc" data-act="open" data-id="${r.id}">${im(r)}<div class="in">${esc(r.name)}</div></div>`).join('')}</div>`:'<div class="emp">Marca recetas con ♡ para verlas aquí.</div>'}</div></div>
<div class="Rr"><div class="tr o2"><label class="srch">${ic('search')}<input id="q" placeholder="Buscar recetas…" value="${esc(V.q)}" autocomplete="off"></label><button class="sun" data-act="go" data-p="set" aria-label="Ajustes">${ic('sun',24)}</button></div>
${f?`<div class="card o5"><div class="ft"><div>${im(f)}<div class="dots">${pool.map((_,i)=>`<i class="${i===V.f%pool.length?'on':''}" data-act="feat" data-i="${i}"></i>`).join('')}</div></div><div><div class="ch" style="align-items:flex-start"><h3>${esc(f.name)}</h3><button class="ib ${f.fav?'fav':''}" data-act="fav" data-id="${f.id}" aria-label="Favorita" style="background:none">${ic('heart')}</button></div><div class="m2"><span>${ic('clock',17)} ${tot(f)} min</span><span>${ic('fork',17)} ${f.servings} raciones</span><span>${ic('chef',17)} ${esc(f.diff)}</span></div><p style="font-size:14px;margin:0 0 14px">${esc(f.desc)}</p><button class="btn" data-act="open" data-id="${f.id}">Ver receta ${ic('arrow',16)}</button></div></div></div>`:''}
<div class="card o6"><div class="ch"><h3>${ic('cart',28)} Lista de la Compra</h3><button class="btn ol sm" data-act="go" data-p="shop">${ic('plus',15)} Añadir</button></div><div class="shw"><div class="ls">${S.shop.slice(0,5).map(x=>shopRow(x,false)).join('')||'<div class="emp">Tu lista está vacía.</div>'}<a class="lk" data-act="go" data-p="shop" href="#shop" aria-label="Ver toda la lista" style="font-size:24px;margin-top:6px">•••</a></div>${TOTE}</div></div>
<div class="card nx o8"><div class="ch"><h3>${ic('star',24)} Próximas comidas</h3><a class="lk" data-act="go" data-p="cal" href="#cal">Ver calendario ${ic('arrow',14)}</a></div>${nextMeals()}<span class="fl2">${FL}</span></div></div></div>`};
const NAV=[['home','Inicio','Inicio','home'],['recipes','Mis Recetas','Recetas','book'],['cal','Calendario','Calendario','cal'],['shop','Lista de la Compra','Compra','cart'],['favs','Favoritas','Favoritas','heart'],['set','Ajustes','Ajustes','gear']];
const render=()=>{const cur=V.p==='recipe'?'recipes':V.p;$('#app').innerHTML=`<aside class="side"><div class="logo">${CH}<h2>Recetitas</h2><div style="color:var(--w)">${ic('heart',22)}</div></div>${NAV.map(n=>`<div class="nv ${cur===n[0]?'on':''}" data-act="go" data-p="${n[0]}">${ic(n[3],22)}<span class="l">${n[1]}</span><span class="s">${n[2]}</span></div>`).join('')}<div class="note">Cocina<br>con amor ♡</div>${FL}</aside><main>${(P[V.p]||P.home)()}</main>`};
const day=k=>{const[y,m,d]=k.split('-'),l=S.plan.filter(x=>x.date===k&&rec(x.rid));modal(`<h2>${+d} de ${MES[m-1]} de ${y}</h2>${l.map(x=>`<div class="nm" style="grid-template-columns:36px 1fr 130px 36px"><span data-act="open" data-id="${x.rid}">${im(rec(x.rid))}</span><span>${esc(rec(x.rid).name)}</span><input type="date" value="${x.date}" data-mv="${x.id}" aria-label="Cambiar fecha" style="border:1px solid var(--line);border-radius:10px;padding:4px"><button class="ib" data-act="prm" data-id="${x.id}" data-d="${k}" aria-label="Quitar del calendario">${ic('x',15)}</button></div>`).join('')||'<p class="mt">Todavía no hay recetas este día.</p>'}<label class="f">Añadir una receta</label>${S.recipes.length?`<div class="g2"><select id="dr">${S.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn ol" data-act="padd" data-d="${k}">${ic('plus',16)} Añadir</button></div>`:'<p class="mt">Crea primero alguna receta.</p>'}<div class="acts"><button class="btn gh" data-act="close">Cerrar</button></div>`)};
const rowI=(g={q:'',n:''})=>`<div class="ir"><input placeholder="Cantidad" value="${esc(g.q)}"><input placeholder="Ingrediente" value="${esc(g.n)}"><button class="ib" data-act="rm" aria-label="Quitar">${ic('x',14)}</button></div>`,rowS=s=>`<div class="sr"><textarea rows="2" placeholder="Describe el paso">${esc(s)}</textarea><button class="ib" data-act="rm" aria-label="Quitar">${ic('x',14)}</button></div>`;
const form=r=>{PH=r?r.photo:'';const e=r||{ings:[{q:'',n:''}],steps:[''],videos:[],links:[],prep:'',cook:'',servings:2,diff:'Fácil',cat:'Principales',name:'',desc:'',notes:''},o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
modal(`<h2>${r?'Editar':'Nueva'} receta</h2><label class="f">Nombre</label><input id="fn" value="${esc(e.name)}"><label class="f">Fotografía</label><input type="file" id="fp" accept="image/*"><div id="pv">${PH?`<img class="pv" src="${PH}">`:''}</div><label class="f">Descripción</label><textarea id="fd" rows="2">${esc(e.desc)}</textarea>
<div class="g4"><div><label class="f">Prep. (min)</label><input id="fpr" type="number" min="0" value="${e.prep}"></div><div><label class="f">Cocción (min)</label><input id="fc" type="number" min="0" value="${e.cook}"></div><div><label class="f">Raciones</label><input id="fs" type="number" min="1" value="${e.servings}"></div><div><label class="f">Dificultad</label><select id="fdf">${o(['Fácil','Media','Difícil'],e.diff)}</select></div></div><label class="f">Categoría</label><select id="fcat">${o(CATS,e.cat)}</select>
<label class="f">Ingredientes</label><div id="il">${e.ings.map(rowI).join('')}</div><button class="btn gh sm" data-act="addi">${ic('plus',14)} Ingrediente</button><label class="f">Pasos</label><div id="sl">${e.steps.map(rowS).join('')}</div><button class="btn gh sm" data-act="adds">${ic('plus',14)} Paso</button>
