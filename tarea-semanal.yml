name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la base de datos
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js | head -1)
          KEY=$(grep -o "eyJ[A-Za-z0-9._-]*\|sb_publishable_[A-Za-z0-9_-]*" config.js | head -1)
          curl -fsS "$URL/rest/v1/items?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
      - name: Evitar que GitHub desactive esta tarea
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "Mantener Supabase activo" --repo "$GITHUB_REPOSITORY" || true
